# Logging, seed, config and checkpointing
output_dir: ${output_dir}
cache_dir: .cache
report_to: swanlab
seed: 42
checkpointing_steps: 5000 # 5000 改 1000
save_total_limit: 2
upcast_before_saving: true
resume_from_checkpoint: null # latest

# model parameters
proj_meta: ${proj_meta}
embed_dim: 1024

ip_adapter_name_or_path: ../BRIDGE/pretrained/ip-adapter_sdxl_vit-h.safetensors # TODO
diffusion_model_name_or_path: ../BRIDGE/pretrained/stable-diffusion-xl-base-1.0 # TODO
eval_diffusion_model_name_or_path: ../BRIDGE/pretrained/stable-diffusion-xl-base-1.0 # TODO
# Data loading
dataset_name: imagenet-1k
image_directory: ../BRIDGE/data/visual-layer/imagenet-1k-vl-enriched/data # TODO
embedding_directory: ../BRIDGE/data/visual-layer/imagenet-1k-vl-enriched/embeddings_multiscale # TODO
eval_dataset_name: things
eval_image_directory: ../BRIDGE/data/things-eeg/Image_set # TODO
eval_embedding_directory: ../BRIDGE/data/things-eeg/embeddings_multiscale # TODO
eval_split: test
resolution: 512

# Training
drop_prob: 0.1
learning_rate: 1e-4
adam_weight_decay: 0.01
adam_beta1: 0.9
adam_beta2: 0.999
num_train_epochs: 1
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
dataloader_num_workers: 8

lr_warmup_steps: 0
lr_scheduler: constant
max_grad_norm: 1.0

per_device_eval_batch_size: 4
max_eval_samples: null
validation_steps: 2000
# max_steps: 21

do_eval: true
